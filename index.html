<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="모아에서 생각을 빠르게 기록하고, 주제로 모아보세요.">
  <title>모아 — 개인 메모장</title>
  <link rel="icon" href="./moa.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=4">
  <script type="module" src="./app.js?v=4"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-notes" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6m-6 4h6m-6 4h3"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="m7 5-4 9v5h18v-5l-4-9H7Z"/><path d="M3 14h5l2 2h4l2-2h5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m15 3 6 6-3.5 1.2-3.5 3.5.5 3-1 1-7.2-7.2 1-1 3 .5 3.5-3.5L15 3ZM6 18l4-4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15 15 4 4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20 14 13 21l-9-9V4h8l8 8a1.4 1.4 0 0 1 0 2Z"/><circle cx="8.5" cy="8.5" r="1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 17v3h14v-3"/></symbol>
    <symbol id="i-account" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20v-1a7 7 0 0 1 14 0v1"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M5 7h14M8 12h8m-5 5h2"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M7 7l1 13h8l1-13M9 7V4h6v3"/></symbol>
  </svg>

  <aside class="rail" aria-label="메모 보관함">
    <a class="brand" href="./" aria-label="모아 홈"><img src="./moa.svg" alt="" width="38" height="38"><span>모아</span></a>
    <div id="rail-content" hidden>
      <p class="rail-heading">보관함</p>
      <nav id="folders" class="folders" aria-label="보관함"></nav>
      <div class="rail-topics">
        <p class="rail-heading">분류</p>
        <nav id="topics" class="topics" aria-label="분류"></nav>
      </div>
    </div>
    <div class="rail-footer" id="rail-footer" hidden>
      <button type="button" class="rail-link" id="backup"><svg class="icon"><use href="#i-export"/></svg>백업 및 가져오기</button>
      <button type="button" class="rail-link" id="signout" hidden><svg class="icon"><use href="#i-account"/></svg>로그아웃</button>
    </div>
  </aside>

  <main>
    <div class="workspace" id="workspace" hidden>
      <header class="topbar">
        <span class="today" id="today"></span>
        <span class="connection" id="connection" role="status"></span>
        <button type="button" class="icon-btn mobile-utility" id="mobile-backup" aria-label="백업 및 가져오기"><svg class="icon"><use href="#i-export"/></svg></button>
        <button type="button" class="icon-btn mobile-utility" id="mobile-signout" aria-label="로그아웃" hidden><svg class="icon"><use href="#i-account"/></svg></button>
      </header>

      <section class="capture" aria-labelledby="page-title">
        <h1 id="page-title">내 메모</h1>
        <form id="capture-form" class="capture-form">
          <label for="capture-title">제목 <span class="field-optional">선택</span></label>
          <input id="capture-title" class="capture-title" type="text" maxlength="120" placeholder="메모 제목">
          <label for="capture-body">내용</label>
          <textarea id="capture-body" rows="2" maxlength="20000" placeholder="떠오르는 생각을 적어보세요"></textarea>
          <div class="capture-footer">
            <span class="shortcut">Ctrl / ⌘ + Enter</span>
            <button type="submit" id="capture-submit" class="primary"><svg class="icon"><use href="#i-plus"/></svg>메모 저장</button>
          </div>
        </form>
      </section>

      <div id="mobile-nav" class="mobile-nav" aria-label="메모 보기"></div>
      <section class="collection" aria-labelledby="list-title">
        <div class="collection-header">
          <h2 id="list-title">모든 메모</h2>
          <span id="note-count" class="note-count"></span>
          <div class="list-controls">
            <label class="search"><svg class="icon"><use href="#i-search"/></svg><input type="search" id="search" maxlength="120" placeholder="메모 검색" aria-label="메모 검색"></label>
            <button type="button" class="icon-btn outline" id="select" aria-label="여러 메모 선택" aria-pressed="false" title="여러 메모 선택"><svg class="icon"><use href="#i-select"/></svg></button>
            <button type="button" class="icon-btn outline" id="sort" aria-label="오래된 메모부터 보기" aria-pressed="false" title="오래된 메모부터 보기"><svg class="icon"><use href="#i-sort"/></svg></button>
          </div>
        </div>
        <div id="selection" class="selection-bar" hidden>
          <span id="selected-count"></span>
          <button type="button" class="plain-btn" id="select-all">표시된 메모 모두 선택</button>
          <div class="selection-actions">
            <button type="button" class="soft-btn" id="batch-tags">분류 추가</button>
            <button type="button" class="danger batch-danger" id="batch-delete">선택 삭제</button>
          </div>
        </div>
        <div class="note-grid" id="notes"></div>
        <div id="empty" class="empty" hidden><svg class="icon"><use href="#i-inbox"/></svg><p id="empty-title"></p><button type="button" class="plain-btn" id="clear-search" hidden>검색 지우기</button></div>
      </section>
    </div>

    <section class="auth" id="auth">
      <h1>내 메모</h1>
      <p id="auth-caption" role="status">메모장을 여는 중이에요.</p>
      <form id="login" hidden>
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="primary">로그인</button>
      </form>
    </section>
    <noscript>모아를 사용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
  </main>

  <dialog id="capture-categories" class="capture-categories" aria-labelledby="capture-categories-title" aria-describedby="capture-mode-hint">
    <div class="category-heading">
      <h2 id="capture-categories-title">어디에 분류할까요?</h2>
      <div class="category-modes" role="group" aria-label="분류 방식">
        <button type="button" id="category-single" aria-pressed="true" autofocus><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>한 곳에</button>
        <button type="button" id="category-multiple" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>여러 곳에</button>
      </div>
    </div>
    <p id="capture-category-status" class="capture-category-status" role="status"></p>
    <p id="capture-mode-hint" class="capture-mode-hint"></p>
    <div class="quick-actions">
      <div class="quick-options" id="quick-options"></div>
      <button type="button" class="quick-button quick-new" id="quick-new" aria-expanded="false" aria-controls="quick-form"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>새 분류</button>
      <button type="button" class="quick-button quick-more" id="quick-more" aria-expanded="false" aria-controls="quick-options" hidden>모든 분류</button>
    </div>
    <form id="quick-form" class="quick-form" hidden>
      <label for="quick-name">새 분류 이름</label>
      <input type="text" id="quick-name" maxlength="20" placeholder="예: 웹사이트" required>
      <button type="submit" class="primary" id="quick-create">만들고 추가</button>
    </form>
    <div class="quick-footer">
      <button type="button" class="quick-button quick-dismiss" id="quick-dismiss">나중에</button>
      <button type="button" class="quick-button primary" id="quick-apply" hidden disabled>선택한 분류에 추가</button>
    </div>
  </dialog>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <div class="dialog-head">
        <h2 id="editor-title">메모 편집</h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <label for="edit-title">제목 <span class="field-optional">선택</span></label>
      <input type="text" id="edit-title" class="edit-title" maxlength="120" placeholder="메모 제목">
      <label for="edit-body">내용</label>
      <textarea id="edit-body" rows="8" maxlength="20000" required></textarea>
      <div class="dialog-actions">
        <button type="button" id="delete-note" class="danger"><svg class="icon"><use href="#i-trash"/></svg>삭제</button>
        <button type="submit" class="primary">저장</button>
      </div>
      <div id="delete-confirm" class="delete-confirm" hidden>
        <p>이 메모를 삭제할까요?</p><button type="button" id="cancel-delete" class="plain-btn">취소</button><button type="button" id="confirm-delete" class="danger">메모 삭제</button>
      </div>
    </form>
  </dialog>

  <dialog id="batch-delete-dialog" aria-labelledby="batch-delete-title" aria-describedby="batch-delete-copy">
    <form id="batch-delete-form">
      <div class="dialog-head">
        <h2 id="batch-delete-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <p id="batch-delete-copy" class="dialog-copy">삭제한 메모는 복원할 수 없어요.</p>
      <div class="dialog-actions end">
        <button type="button" class="plain-btn" id="batch-delete-cancel" autofocus>취소</button>
        <button type="submit" class="danger danger-solid">삭제</button>
      </div>
    </form>
  </dialog>

  <dialog id="tag-dialog" aria-labelledby="tag-title">
    <form id="tag-form">
      <div class="dialog-head">
        <h2 id="tag-title">분류 편집</h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div id="tag-options" class="tag-options"></div>
      <label for="new-tag">새 분류 이름</label>
      <div class="add-tag">
        <input type="text" id="new-tag" maxlength="20" placeholder="예: 웹사이트">
        <button type="button" id="add-tag" class="soft-btn">추가</button>
      </div>
      <div class="dialog-actions end"><button type="submit" class="primary">적용</button></div>
    </form>
  </dialog>

  <dialog id="backup-dialog" aria-labelledby="backup-title">
    <div class="dialog-head">
      <h2 id="backup-title">백업 및 가져오기</h2>
      <button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <p class="dialog-copy">현재 메모를 JSON 파일로 내려받거나, 모아에서 만든 백업 파일의 메모를 추가할 수 있어요.</p>
    <div class="backup-actions">
      <button type="button" class="primary" id="download">백업 내려받기</button>
      <button type="button" class="soft-btn" id="upload">파일 가져오기</button>
      <input type="file" id="backup-file" accept=".json,application/json" hidden>
    </div>
  </dialog>

  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
  <div class="visually-hidden" id="announcement" role="status" aria-live="polite"></div>
</body>
</html>
